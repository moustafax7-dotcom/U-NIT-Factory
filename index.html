{g:'tops',en:'Raw-Seam T-Shirt',ar:'تيشيرت بخياطة خام',de:'Oversized tee with exposed raw seams and a rubber patch, in four colours.',da:'تيشيرت واسع بخياطة خام ظاهرة وليبل مطاطي، بأربع ألوان.',im:['tees-2']},
{g:'tops',en:'Polo Shirts',ar:'بولو شيرت',de:'Classic polo styles with clean finishing.',da:'بولو كلاسيك بتشطيب نظيف.',im:['product_1'],ph:1},
{g:'tops',en:'Piped Zip Hoodie',ar:'هودي بسوستة وشريط أبيض',de:'Oversized hoodie with a contrast white piping and half zip, in black and beige.',da:'هودي واسع بنص سوستة وشريط أبيض على الحواف، أسود وبيج.',im:['hoodp-1','hoodp-2']},
{g:'tops',en:'Colour-Block Hoodie',ar:'هودي بغطا مختلف اللون',de:'Pullover hoodie with a contrast hood and layered hem, in several colours.',da:'هودي بدون سوستة بغطا بلون مختلف وحافة مزدوجة، بألوان مختلفة.',im:['hoodc-1','hoodc-2']},
{g:'tops',en:'Sweatshirts',ar:'سويت شيرتات',de:'Sweatshirts for the cooler seasons.',da:'سويت شيرتات للمواسم الباردة.',im:['product_6'],ph:1},
{g:'bottoms',en:'Pocket Shorts',ar:'شورت بجيوب',de:'Soft sweat shorts with front pockets, in several colours.',da:'شورت قطن ناعم بجيوب قدّامية وبألوان مختلفة.',im:['shorts-1','shorts-2']},
{g:'bottoms',en:'Distressed Side-Stripe Shorts',ar:'شورت مقطّع بشريط جانبي',de:'Washed look with distressing and a side stripe.',da:'شورت بغسلة وتقطيع وشريط جانبي.',im:['shorts-10','shorts-3']},
{g:'bottoms',en:'Embossed Logo Shorts',ar:'شورت بشعار بارز',de:'Soft sweat shorts with a large embossed lettering, in black, white and green.',da:'شورت قطن ناعم بكتابة بارزة كبيرة، أسود وأبيض وأخضر.',im:['shorts-11']},
{g:'bottoms',en:'Wide Shorts with Clip',ar:'شورت واسع بكليب',de:'Relaxed wide-cut shorts with a metal clip.',da:'شورت واسع مريح بكليب معدن.',im:['shorts-8','shorts-4','shorts-9']},
{g:'bottoms',en:'Cargo Shorts',ar:'شورت كارجو',de:'Cargo shorts with large flap pockets.',da:'شورت كارجو بجيوب كبيرة بغطا.',im:['shorts-6','shorts-7','shorts-5']},
{g:'bottoms',en:"Men's Pants",ar:'بناطيل رجالي',de:"Men's pants.",da:'بناطيل رجالي.',im:['product_3'],ph:1},
{g:'bottoms',en:"Wide-Leg Pants (Women)",ar:'بنطلون وايد ليج حريمي',de:'Plain wide-leg pants for women.',da:'بنطلون وايد ليج سادة حريمي.',im:['mpants-1']},
{g:'bottoms',en:'Striped Wide-Leg Pants (Women)',ar:'وايد ليج بخطوط حريمي',de:'Wide-leg pants with twin side stripes.',da:'بنطلون وايد ليج بخطين جانبيين حريمي.',im:['wpants-1','wpants-5']},
{g:'bottoms',en:'Charleston Pants with Stripes (Women)',ar:'بنطلون شارلستون بخطوط حريمي',de:'Fitted at the top and flared below, with side stripes.',da:'ضيق من فوق ومتوسّع من تحت بخطوط جانبية، حريمي.',im:['wpants-2']},
{g:'bottoms',en:'Charleston Pants with Slit (Women)',ar:'بنطلون شارلستون بفتحة حريمي',de:'Fitted and flared with a slit at the hem.',da:'ضيق ومتوسّع من تحت بفتحة عند الأسفل، حريمي.',im:['wpants-3','wpants-6']},
{g:'bottoms',en:'Charleston Pants with Wide Stripe (Women)',ar:'بنطلون شارلستون بخط عريض حريمي',de:'Fitted and flared with a bold side stripe.',da:'ضيق ومتوسّع من تحت بخط جانبي عريض، حريمي.',im:['wpants-4']},
{g:'bottoms',en:'Leggings (Women)',ar:'ليجن حريمي',de:'High-waist fitted leggings.',da:'ليجن ضيق بخصر عالي، حريمي.',im:['wpants-7']},
{g:'bottoms',en:'Cargo Sweatpants',ar:'سروال كارجو',de:'Relaxed fleece sweatpants with large cargo pockets and drawcord hems.',da:'سروال قطن مبطّن مريح بجيوب كارجو كبيرة وأستك سحاب عند الأسفل.',im:['sweatpants-1']},
{g:'sets',en:'Zip Jacket Set',ar:'طقم جاكيت بسوستة',de:'High-collar zip jacket with matching pants, in black and grey.',da:'جاكيت بياقة عالية وسوستة مع بنطلون بنفس القماش، أسود ورمادي.',im:['sets-1','sets-2','sets-3','sets-4']},
{g:'sets',en:'Clasp Hoodie Set',ar:'طقم هودي بمشابك',de:'Hoodie with metal clasps and matching pants, in several colours.',da:'هودي بمشابك معدن مع بنطلون بنفس القماش وبألوان مختلفة.',im:['hoodies-1','hoodies-2','sets-5','sets-7','sets-6','sets-8','sets-9']},
{g:'sets',en:'Sleeveless Hoodie & Shorts Set',ar:'طقم هودي بدون أكمام وشورت',de:'Sleeveless hoodie with matching shorts and embroidered text, in black, white and cream.',da:'هودي بدون أكمام مع شورت بنفس القماش وتطريز، أسود وأبيض وكريم.',im:['sets-10','sets-11']},
{g:'sets',en:'Hoodie Set',ar:'طقم هودي',de:'Zip and pullover hoodies with matching pants.',da:'هوديز بسوستة وبدون مع بنطلون بنفس القماش.',im:['hoodies-3']}];
const src=f=>(typeof IMGS!=='undefined'&&IMGS[f])||`assets/images/${f}.webp`;
const C=window.NULRA_CONFIG||{},$=s=>document.querySelector(s);let lang='en',filt='all',cur=null;
const T=(en,ar)=>lang==='ar'?ar:en;
function formUrl(v){try{const u=new URL((v||'').trim());if(u.protocol!=='https:'||u.hostname!=='docs.google.com'||!/^\/forms\/d\/(e\/)?[\w-]+\/viewform\/?$/.test(u.pathname))return null;u.searchParams.set('embedded','true');return u.href}catch{return null}}
function grid(){$('#cnt').textContent=P.length;$('#grid').innerHTML=P.map((p,i)=>(filt==='all'||p.g===filt)?`<button class="card" data-i="${i}"><img src="${src(p.im[0])}" alt="" loading="lazy">${p.ph?'<em class="soon">'+T('Photo soon','الصورة قريباً')+'</em>':''}<div><h3>${T(p.en,p.ar)}</h3><span>${p.im.length>1?T(p.im.length+' photos',p.im.length+' صور')+' · ':''}${T('View','شوف')} →</span></div></button>`:'').join('')}
function formOld(){const u=formUrl(lang==='ar'?C.googleFormAr:C.googleFormEn);$('#ph').hidden=!!u;$('#fw').hidden=!u;if(u){const f=$('#fr');if(f.getAttribute('src')!==u)f.src=u;$('#ext').href=u.replace(/([?&])embedded=true(&|$)/,(m,b,a)=>a?b:'')}}
function contact(){const w=(C.whatsappNumber||'').replace(/\D/g,''),f=C.facebookUrl,h=[];if(w)h.push(`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${w}">WhatsApp</a>`);if(/^https:\/\/(www\.)?facebook\.com\//.test(f||''))h.push(`<a class="btn ghost" target="_blank" rel="noopener" href="${f}">Facebook</a>`);$('#contact').innerHTML=h.join('')}
function form(){if(nativeOK()){$('#ph').hidden=true;$('#fw').hidden=true;if($('#nok').hidden){$('#nf').hidden=false;renderNF()}return}formOld()}
function fill(){const p=P[cur];$('#car').innerHTML=p.im.map(f=>`<img src="${src(f)}" alt="">`).join('');$('#car').scrollLeft=0;nav();$('#dt').textContent=T(p.en,p.ar);$('#dd').textContent=T(p.de,p.da);$('#dc').textContent=T('Enquire about this','اطلب التصنيع');$('#cn').hidden=$('#cp').hidden=$('#cx').hidden=p.im.length<2}
function nav(){const c=$('#car'),n=P[cur].im.length,w=c.clientWidth||1,k=Math.min(n,Math.round(Math.abs(c.scrollLeft)/w)+1);$('#cx').textContent=k+' / '+n}
function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang]);$('#lang').textContent=lang==='ar'?'EN':'عربي';$('#dx').setAttribute('aria-label',T('Close','إغلاق'));grid();form();contact();if(cur!==null)fill()}
$('#lang').onclick=()=>{lang=lang==='ar'?'en':'ar';apply()};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filt=b.dataset.f;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));grid()});
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(!c)return;cur=+c.dataset.i;fill();$('#dlg').showModal()};
$('#car').onscroll=nav;const go=d=>$('#car').scrollBy({left:d*$('#car').clientWidth*(document.dir==='rtl'?-1:1),behavior:'smooth'});$('#cn').onclick=()=>go(1);$('#cp').onclick=()=>go(-1);$('#dx').onclick=()=>$('#dlg').close();$('#dlg').onclick=e=>{if(e.target.id==='dlg')e.target.close()};
$('#dc').onclick=()=>{$('#dlg').close();const p=P[cur],h=$('#hint');h.hidden=false;h.textContent=T(`Interested in ${p.en}? Select the same product in the form below.`,`مهتم بـ ${p.ar}؟ اختار نفس المنتج في الفورم تحت.`)};
const NQ=[
{k:'name',t:'text',r:1,en:'Full Name',ar:'الاسم بالكامل'},
{k:'business',t:'text',r:1,en:'Business / Brand Name',ar:'اسم المحل أو البراند'},
{k:'type',t:'radio',r:1,en:'Your Business Type',ar:'نوع نشاطك',o:[['Clothing brand','براند ملابس'],['Wholesaler','تاجر جملة'],['Retail shop owner (bulk manufacturing only)','صاحب محل (تصنيع بالجملة فقط)'],['Company','شركة'],['Other','أخرى']]},
{k:'phone',t:'tel',r:1,en:'Phone / WhatsApp Number',ar:'رقم التليفون أو واتساب'},
{k:'city',t:'text',en:'City / Governorate',ar:'المدينة / المحافظة'},
{k:'products',t:'check',r:1,en:'What would you like to manufacture?',ar:'عايز تصنّع إيه؟',o:[['T-Shirts','تيشيرتات'],['Polo Shirts','بولو شيرت'],['Shorts','شورتات'],["Men's Pants",'بناطيل رجالي'],["Women's Pants (Wide-Leg / Charleston)",'بناطيل حريمي (وايد ليج / شارلستون)'],['Sets','أطقم'],['Sweatshirts','سويت شيرتات'],['Hoodies','هوديز'],['Sweatpants','سراويل'],['Other / Custom Style','موديل مختلف / تصميم خاص']]},
{k:'qty',t:'number',r:1,en:'Estimated Quantity (pieces)',ar:'الكمية المتوقعة (بالقطعة)'},
{k:'sizes',t:'check',en:'Sizes Needed',ar:'المقاسات المطلوبة',o:[['XS','XS'],['S','S'],['M','M'],['L','L'],['XL','XL'],['XXL','XXL'],['Other / Custom','مقاسات خاصة']]},
{k:'details',t:'area',en:'Details of Your Order',ar:'تفاصيل طلب التصنيع'},
{k:'ref',t:'url',en:'Reference / Design Image Link',ar:'رابط صورة الموديل أو التصميم'},
{k:'contact',t:'radio',en:'Preferred Contact Method',ar:'طريقة التواصل المفضلة',o:[['WhatsApp','واتساب'],['Phone call','مكالمة هاتف']]}];
const NE=C.formEntries||{},NL=C.formLang==='ar'?1:0;
const nativeOK=()=>!!C.formPreview||['name','business','type','phone','products','qty'].every(k=>/^entry\.\d+$/.test(NE[k]||''))&&!!formUrl(C.googleFormAr||C.googleFormEn);
const GH={name:[1,'Your details','بياناتك'],products:[2,'Your order','طلبك'],details:[3,'Extras','تفاصيل إضافية']};
const NA=q=>NE[q.k]||C.formPreview;
function renderNF(){const f=$('#nf');f.innerHTML=(C.formPreview?`<div class="pv">${T('Design preview only. This form is not connected yet and nothing is sent.','معاينة للشكل فقط. الفورم لسه مش متوصّل ومفيش حاجة بتتبعت.')}</div>`:'')+NQ.filter(NA).map(q=>{const L=T(q.en,q.ar)+(q.r?' <span class="req">*</span>':'');let b;
if(q.t==='radio'||q.t==='check')b=`<fieldset><legend>${L}</legend><div class="opts">${q.o.map((o,i)=>`<label><input type="${q.t==='radio'?'radio':'checkbox'}" name="${q.k}" value="${o[NL].replace(/"/g,'&quot;')}"${q.t==='radio'&&q.r&&i===0?'':''}>${T(o[0],o[1])}</label>`).join('')}</div></fieldset>`;
else if(q.t==='area')b=`<label>${L}<textarea name="${q.k}" rows="4"></textarea></label>`;
else b=`<label>${L}<input type="${q.t}" name="${q.k}"${q.t==='number'?' min="1" inputmode="numeric"':''}${q.t==='tel'?' inputmode="tel"':''}></label>`;
const g=GH[q.k]?`<div class="ng"><i>${GH[q.k][0]}</i>${T(GH[q.k][1],GH[q.k][2])}</div>`:'';return g+`<div data-q="${q.k}" class="${['text','tel','number','url'].includes(q.t)?'':'full'}">${b}<div class="nerr" hidden></div></div>`}).join('')+`<button class="btn" type="submit">${T('Send enquiry','ابعت الطلب')}</button><p class="note" style="margin:0">${T('We use your details only to reply to your enquiry.','هنستخدم بياناتك للرد على استفسارك فقط.')}</p>`}
function sendNF(e){e.preventDefault();const f=$('#nf'),fd=new FormData(),bad=[];
NQ.filter(NA).forEach(q=>{const box=f.querySelector(`[data-q="${q.k}"]`),err=box.querySelector('.nerr');let v;
if(q.t==='check'){v=[...f.querySelectorAll(`[name="${q.k}"]:checked`)].map(i=>i.value)}else if(q.t==='radio'){const c=f.querySelector(`[name="${q.k}"]:checked`);v=c?[c.value]:[]}else{v=[f.querySelector(`[name="${q.k}"]`).value.trim()].filter(Boolean)}
let m='';if(q.r&&!v.length)m=T('Required','مطلوب');else if(q.t==='number'&&v.length&&!(+v[0]>=1))m=T('Enter 1 or more','اكتب رقم 1 أو أكتر');else if(q.t==='url'&&v.length&&!/^https?:\/\/\S+$/i.test(v[0]))m=T('Enter a valid link','اكتب لينك صحيح');else if(q.t==='tel'&&v.length&&v[0].replace(/\D/g,'').length<7)m=T('Enter a valid number','اكتب رقم صحيح');
err.textContent=m;err.hidden=!m;box.classList.toggle('bad',!!m);if(m)bad.push(box);v.forEach(x=>fd.append(NE[q.k],x))});
if(bad.length){bad[0].scrollIntoView({behavior:'smooth',block:'center'});return}
const btn=f.querySelector('button');if(C.formPreview){f.hidden=true;const o=$('#nok');o.textContent=T('Preview only: the form is not connected yet, so nothing was sent.','معاينة فقط: الفورم لسه مش متوصّل فمفيش حاجة اتبعتت.');o.hidden=false;return}btn.disabled=true;
fetch((C.googleFormAr||C.googleFormEn).replace(/\/viewform.*$/,'/formResponse'),{method:'POST',mode:'no-cors',body:fd}).then(()=>{f.hidden=true;$('#nok').hidden=false;$('#nok').scrollIntoView({behavior:'smooth',block:'center'})}).catch(()=>{btn.disabled=false;alert(T('Could not send. Please check your connection and try again.','مقدرناش نبعت. اتأكد من النت وجرّب تاني.'))})}
$('#nf').addEventListener('submit',sendNF);

apply();
</script>
